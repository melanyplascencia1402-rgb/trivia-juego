<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderador - Trivia</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Estilos exclusivos para la pantalla de ganador */
  #end {
    background-image: url('https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=1000&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    padding: 40px 20px;
    border-radius: 20px;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8); /* Sombra para que el texto se lea bien */
    box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.5); /* Oscurece un poco la imagen para resaltar el texto */
  }
  #end h1 { color: white; font-size: 2.5rem; margin-bottom: 10px; }
  #winnerMessage { font-size: 1.8rem; font-weight: bold; color: #ffd700; margin-bottom: 20px; }
  /* Hacemos que los puntajes resalten sobre el fondo */
  #finalRanking .player-row {
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    text-shadow: none;
  }
</style>
</head>
<body>
<div class="card wide">
  <div id="lobby">
    <h1>Panel del Moderador</h1>
    <p>Código de sala: <strong id="roomCode">...</strong></p>
    <img id="qr" alt="QR" style="width:220px; margin:15px auto; display:block;">
    <p class="sub">Los jugadores escanean el QR o entran con el código.</p>
    <h3>Jugadores (<span id="playerCount">0</span>)</h3>
    <div id="playerList" class="players"></div>
    <button id="startBtn" onclick="start()" disabled>Iniciar partida</button>
  </div>

  <div id="game" style="display:none;">
    <div class="progress"><div id="bar" class="progress-bar"></div></div>
    <p id="qCounter" class="sub"></p>
    <h2 id="questionText"></h2>
    <div id="answers" class="answers"></div>
    <p class="timer">Tiempo: <span id="timer">15</span>s</p>
    <h3>Mejores Puntajes</h3>
    <div id="ranking" class="players"></div>
    <button id="nextBtn" onclick="next()" style="display:none;">Siguiente</button>
  </div>

  <!-- Pantalla final modificada -->
  <div id="end" style="display:none;">
    <h1>Fin del juego</h1>
    <div id="winnerMessage"></div>
    <div id="finalRanking" class="players"></div>
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
      <button onclick="location.href='/'">Volver al inicio</button>
      <button onclick="location.reload()">Jugar de nuevo</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let timerInterval;

socket.on('connect', () => socket.emit('createRoom'));

socket.on('roomCreated', ({ code, qr }) => {
  document.getElementById('roomCode').textContent = code;
  document.getElementById('qr').src = qr;
});

socket.on('updatePlayers', (players) => {
  document.getElementById('playerCount').textContent = players.length;
  document.getElementById('playerList').innerHTML =
    players.map(p => `<div class="player-row">${p.name}</div>`).join('');
  document.getElementById('startBtn').disabled = players.length === 0;
});

socket.on('newQuestion', (data) => {
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'none';

  document.getElementById('qCounter').textContent = `Pregunta ${data.index + 1} de ${data.total}`;
  document.getElementById('questionText').textContent = data.question;
  document.getElementById('bar').style.width = `${(data.index / data.total) * 100}%`;

  document.getElementById('answers').innerHTML =
    data.answers.map((a, i) => `<div class="answer-static">${a}</div>`).join('');

  let t = data.time;
  document.getElementById('timer').textContent = t;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    t--;
    document.getElementById('timer').textContent = Math.max(0, t);
    if (t <= 0) clearInterval(timerInterval);
  }, 1000);
});

socket.on('revealAnswer', ({ correct, players }) => {
  const answersEl = document.getElementById('answers');
  answersEl.querySelectorAll('.answer-static').forEach((el, i) => {
    if (i === correct) el.classList.add('correct');
  });
  
  const top3 = players.slice(0, 3);
  document.getElementById('ranking').innerHTML = top3.map((p, i) =>
    `<div class="player-row ${i === 0 ? 'winner' : ''}">
      #${i + 1} ${p.name} - ${p.score} pts
    </div>`).join('');
    
  document.getElementById('nextBtn').style.display = 'inline-block';
});

socket.on('gameOver', ({ players }) => {
  document.getElementById('game').style.display = 'none';
  document.getElementById('end').style.display = 'block';
  
  const top3 = players.slice(0, 3);
  const winner = players[0];

  // Mensaje de felicitación dinámico
  if (winner) {
    document.getElementById('winnerMessage').textContent = `¡Felicidades a: ${winner.name}!`;
  } else {
    document.getElementById('winnerMessage').textContent = `¡Fin del juego!`;
  }

  document.getElementById('finalRanking').innerHTML = top3.map((p, i) =>
    `<div class="player-row ${i === 0 ? 'winner' : ''}">
      #${i + 1} ${p.name} - ${p.score} pts
    </div>`).join('');
});

socket.on('hostLeft', () => alert('El moderador cerró la sala'));

function start() { socket.emit('startGame'); }
function next() { socket.emit('nextQuestion'); }
</script>
</body>
</html>
