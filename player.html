<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jugador - Trivia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  
  <!-- Nueva pantalla para pedir el apodo -->
  <div id="login">
    <h1>Unirse a la sala</h1>
    <p class="sub">Sala: <strong id="displayRoom"></strong></p>
    <input id="nameInput" placeholder="Escribe tu apodo" maxlength="15">
    <button onclick="entrar()">Entrar a jugar</button>
    <p id="errorMsg" class="status" style="color: red;"></p>
  </div>

  <!-- Pantalla de espera -->
  <div id="waiting" style="display:none;">
    <h1><span id="pname">...</span></h1>
    <p class="sub">Esperando que el moderador inicie...</p>
    <div id="status" class="status">Conectado</div>
  </div>

  <!-- Pantalla de juego -->
  <div id="play" style="display:none;">
    <p id="qCounter" class="sub"></p>
    <h2 id="questionText"></h2>
    <div id="answers" class="answers"></div>
    <p class="timer">Tiempo: <span id="timer">15</span>s</p>
    <p id="result" class="status"></p>
  </div>

  <!-- Pantalla final -->
  <div id="finished" style="display:none;">
    <h1>Fin del juego</h1>
    <p id="myScore" class="sub"></p>
    <div id="finalRanking" class="players"></div>
    <button onclick="location.href='/'">Volver al inicio</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const params = new URLSearchParams(location.search);
const room = params.get('room');
let name = "";

// Si el QR trae el nombre en la URL (por si acaso), lo usamos
if (params.get('name')) {
  name = params.get('name');
  document.getElementById('login').style.display = 'none';
  document.getElementById('waiting').style.display = 'block';
  document.getElementById('pname').textContent = name;
  document.getElementById('status').textContent = "Conectado";
  socket.emit('joinRoom', { code: room, name });
} else {
  // Si no trae nombre, mostramos el login
  document.getElementById('displayRoom').textContent = room;
}

function entrar() {
  const inputName = document.getElementById('nameInput').value.trim();
  if (!inputName) {
    document.getElementById('errorMsg').textContent = "Por favor, escribe un apodo.";
    return;
  }
  name = inputName;
  document.getElementById('login').style.display = 'none';
  document.getElementById('waiting').style.display = 'block';
  document.getElementById('pname').textContent = name;
  socket.emit('joinRoom', { code: room, name });
}

let currentAnswered = false;
let timerInterval;

socket.on('joinError', (msg) => {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('login').style.display = 'block';
  document.getElementById('waiting').style.display = 'none';
});

socket.on('joined', () => {
  document.getElementById('status').textContent = 'Dentro de la sala';
});

socket.on('newQuestion', (data) => {
  document.getElementById('waiting').style.display = 'none';
  document.getElementById('finished').style.display = 'none';
  document.getElementById('play').style.display = 'block';
  document.getElementById('result').textContent = '';
  currentAnswered = false;

  document.getElementById('qCounter').textContent = `Pregunta ${data.index + 1} de ${data.total}`;
  document.getElementById('questionText').textContent = data.question;

  const answersEl = document.getElementById('answers');
  answersEl.innerHTML = data.answers.map((a, i) =>
    `<button class="answer-btn" data-i="${i}">${a}</button>`).join('');

  answersEl.querySelectorAll('.answer-btn').forEach(btn => {
    btn.onclick = () => {
      if (currentAnswered) return;
      currentAnswered = true;
      answersEl.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
      btn.classList.add('selected');
      socket.emit('answer', { answerIndex: parseInt(btn.dataset.i) });
    };
  });

  let t = data.time;
  document.getElementById('timer').textContent = t;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    t--;
    document.getElementById('timer').textContent = Math.max(0, t);
    if (t <= 0) clearInterval(timerInterval);
  }, 1000);
});

socket.on('revealAnswer', ({ correct, players }) => {
  clearInterval(timerInterval);
  const answersEl = document.getElementById('answers');
  answersEl.querySelectorAll('.answer-btn').forEach((btn, i) => {
    if (i === correct) btn.classList.add('correct');
    else if (btn.classList.contains('selected')) btn.classList.add('wrong');
  });

  const me = players.find(p => p.name === name);
  const myPos = players.findIndex(p => p.name === name) + 1;
  document.getElementById('result').textContent =
    me ? `Puntaje: ${me.score} pts - Puesto #${myPos}` : '';
});

socket.on('gameOver', ({ players }) => {
  document.getElementById('play').style.display = 'none';
  document.getElementById('waiting').style.display = 'none';
  document.getElementById('finished').style.display = 'block';

  const me = players.find(p => p.name === name);
  const pos = players.findIndex(p => p.name === name) + 1;
  document.getElementById('myScore').textContent =
    me ? `Quedaste en el puesto #${pos} con ${me.score} pts` : '';

  const top3 = players.slice(0, 3);
  document.getElementById('finalRanking').innerHTML = top3.map((p, i) =>
    `<div class="player-row ${i === 0 ? 'winner' : ''}">
      #${i + 1} ${p.name} - ${p.score} pts
    </div>`).join('');
});

socket.on('hostLeft', () => {
  document.getElementById('status').textContent = 'El moderador cerró la sala';
});
</script>
</body>
</html>
